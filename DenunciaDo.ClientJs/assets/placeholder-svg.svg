    <rect x="240" y="400" width="15" height="15"/>
    <rect x="240" y="430" width="15" height="15"/>
    <rect x="240" y="460" width="15" height="15"/>
    
    <rect x="310" y="340" width="15" height="15"/>
    <rect x="335" y="340" width="15" height="15"/>
    <rect x="310" y="370" width="15" height="15"/>
    <rect x="335" y="370" width="15" height="15"/>
    <rect x="310" y="400" width="15" height="15"/>
    <rect x="335" y="400" width="15" height="15"/>
    <rect x="310" y="430" width="15" height="15"/>
    <rect x="335" y="430" width="15" height="15"/>
    <rect x="310" y="460" width="15" height="15"/>
    <rect x="335" y="460" width="15" height="15"/>
    
