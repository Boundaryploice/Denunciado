    <rect x="185" y="350" width="15" height="15"/>
    <rect x="165" y="380" width="15" height="15"/>
    <rect x="185" y="380" width="15" height="15"/>
    <rect x="165" y="410" width="15" height="15"/>
    <rect x="185" y="410" width="15" height="15"/>
    <rect x="165" y="440" width="15" height="15"/>
    <rect x="185" y="440" width="15" height="15"/>
    <rect x="165" y="470" width="15" height="15"/>
    <rect x="185" y="470" width="15" height="15"/>
    
