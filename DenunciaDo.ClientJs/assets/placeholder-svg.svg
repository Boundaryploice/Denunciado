    <rect x="690" y="400" width="15" height="15"/>
    <rect x="720" y="400" width="15" height="15"/>
    <rect x="660" y="430" width="15" height="15"/>
    <rect x="690" y="430" width="15" height="15"/>
    <rect x="720" y="430" width="15" height="15"/>
    <rect x="660" y="460" width="15" height="15"/>
    <rect x="690" y="460" width="15" height="15"/>
    <rect x="720" y="460" width="15" height="15"/>
