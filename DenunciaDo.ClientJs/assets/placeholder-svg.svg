    <rect x="580" y="330" width="15" height="15"/>
    <rect x="580" y="360" width="15" height="15"/>
    <rect x="580" y="390" width="15" height="15"/>
    <rect x="580" y="420" width="15" height="15"/>
    <rect x="580" y="450" width="15" height="15"/>
    
    <rect x="660" y="340" width="15" height="15"/>
    <rect x="690" y="340" width="15" height="15"/>
    <rect x="720" y="340" width="15" height="15"/>
