    <rect x="290" y="320" width="70" height="180"/>
    <rect x="380" y="250" width="50" height="250"/>
    <rect x="450" y="350" width="90" height="150"/>
    <rect x="560" y="280" width="60" height="220"/>
    <rect x="640" y="320" width="110" height="180"/>
