    <rect x="395" y="270" width="15" height="15"/>
    <rect x="395" y="300" width="15" height="15"/>
    <rect x="395" y="330" width="15" height="15"/>
    <rect x="395" y="360" width="15" height="15"/>
    <rect x="395" y="390" width="15" height="15"/>
    <rect x="395" y="420" width="15" height="15"/>
    <rect x="395" y="450" width="15" height="15"/>
    
    <!-- More windows in other buildings -->
    <rect x="470" y="370" width="15" height="15"/>
    <rect x="500" y="370" width="15" height="15"/>
    <rect x="470" y="400" width="15" height="15"/>
    <rect x="500" y="400" width="15" height="15"/>
    <rect x="470" y="430" width="15" height="15"/>
