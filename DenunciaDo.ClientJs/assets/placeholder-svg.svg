  <!-- Ground -->
  <rect x="0" y="500" width="800" height="100" fill="#d1d5db"/>
  
  <!-- Sun or moon -->
  <circle cx="650" cy="150" r="60" fill="#fbbf24"/>
  
  <!-- Clouds -->
  <g fill="#f9fafb" opacity="0.8">
    <ellipse cx="200" cy="150" rx="50" ry="30"/>
    <ellipse cx="240" cy="140" rx="60" ry="35"/>
    <ellipse cx="280" cy="160" rx="40" ry="25"/>
    
    <ellipse cx="500" cy="100" rx="60" ry="35"/>
    <ellipse cx="540" cy="90" rx="70" ry="40"/>
    <ellipse cx="580" cy="110" rx="50" ry="30"/>
  </g>
  
  <!-- Central placeholder icon -->
  <g transform="translate(400, 250)">
    <circle cx="0" cy="0" r="100" fill="#3b82f6" opacity="0.9"/>
    
    <!-- Document/complaint icon -->
    <g fill="white" transform="translate(-50, -50) scale(0.8)">
      <rect x="10" y="10" width="100" height="130" rx="5" fill="white"/>
      <rect x="30" y="40" width="60" height="10" fill="#3b82f6"/>
      <rect x="30" y="60" width="60" height="10" fill="#3b82f6"/>
      <rect x="30" y="80" width="60" height="10" fill="#3b82f6"/>
      <rect x="30" y="100" width="40" height="10" fill="#3b82f6"/>
      
      <!-- Voice/comment icon -->
      <g transform="translate(60, 20)">
        <circle cx="35" cy="40" r="25" fill="#ef4444"/>
        <path d="M35,20 L35,60 M20,30 L50,30 M20,50 L50,50" stroke="white" stroke-width="5" stroke-linecap="round"/>
      </g>
    </g>
  </g>
  
  <!-- Text placeholder -->
  <text x="400" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1f2937">Imagen no disponible</text>
</svg>